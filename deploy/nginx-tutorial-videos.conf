# Include inside the production HTTPS server block, outside the app proxy location.
# Media is installed separately; this directory must contain only public tutorials.
location ^~ /media/tutorials/ {
    alias /opt/arknights-infra/shared/tutorial-videos/;
    autoindex off;
    sendfile on;
    types { video/mp4 mp4; }
    default_type application/octet-stream;
    expires 1d;
}
