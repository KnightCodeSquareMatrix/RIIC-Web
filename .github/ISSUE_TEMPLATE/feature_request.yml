name: Feature request
description: 提议产品能力或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: 用户需求
      description: 谁在什么场景遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述期望行为，不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 此请求不要求公开私有 solver、服务器 helper、内部资料或真实用户数据
          required: true
