name: Deploy verified branch

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Immutable release artifact produced by the post-merge build job
        required: true
        type: string
      deployment_authorized:
        description: The caller validated that this event may deploy the verified ref
        required: true
        type: boolean
      deploy_required:
        description: The verified change scope requires an application release
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      inputs.deployment_authorized &&
      inputs.deploy_required &&
      (github.ref_name == 'main' || github.ref_name == 'develop') &&
      vars.DEPLOY_AUTOMATION_ENABLED == '1' &&
      github.repository == 'KnightCodeSquareMatrix/RIIC-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_DEBUG_TOOLS_ENABLED: ${{ vars.DEPLOY_DEBUG_TOOLS_ENABLED || '0' }}
      DEPLOY_RATE_LIMIT_ENABLED: ${{ vars.DEPLOY_RATE_LIMIT_ENABLED || '1' }}
      DEPLOY_APPROVED_SOLVER_SHA256: ${{ vars.DEPLOY_APPROVED_SOLVER_SHA256 }}
      DEPLOY_EXPECTED_REPOSITORY: KnightCodeSquareMatrix/RIIC-Web
      DEPLOY_RELEASE_HELPER_CONTRACT: "6"

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Resolve verified release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          deploy_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$deploy_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'DEPLOY_TREE_SHA=%s\n' "$deploy_tree_sha"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
            printf 'DEPLOY_ARTIFACT_PARENT=%s\n' "$RUNNER_TEMP/riic-web-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          [[ "$DEPLOY_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_SSH_USER" != "root"
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_SERVICE" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$DEPLOY_DEBUG_TOOLS_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_RATE_LIMIT_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_APPROVED_SOLVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$DEPLOY_EXPECTED_REPOSITORY" = "KnightCodeSquareMatrix/RIIC-Web"
          [[ "$DEPLOY_RELEASE_HELPER_CONTRACT" =~ ^[1-9][0-9]*$ ]]
          if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
            test "$DEPLOY_APP_ROOT" = "/opt/arknights-infra"
            test "$DEPLOY_SERVICE" = "arknights-infra"
          else
            [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra-[A-Za-z0-9._-]+$ ]]
            [[ "$DEPLOY_SERVICE" =~ ^arknights-infra-[A-Za-z0-9_.@-]+$ ]]
          fi
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_url_pattern='^https?://[A-Za-z0-9._:/?&=%-]+$'
            [[ "$DEPLOY_PUBLIC_HEALTH_URL" =~ $public_health_url_pattern ]]
            echo "DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/riic-web-release-${{ github.run_id }}-${{ github.run_attempt }}/download

      - name: Validate and extract release artifact
        shell: bash
        run: |
          set -euo pipefail
          download_root="$DEPLOY_ARTIFACT_PARENT/download"
          artifact_root="$DEPLOY_ARTIFACT_PARENT/release"
          local_archive="$download_root/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"
          checksum_file="$download_root/SHA256SUMS"
          test -d "$download_root"
          test ! -L "$download_root"
          test -f "$local_archive"
          test ! -L "$local_archive"
          test -f "$checksum_file"
          test ! -L "$checksum_file"
          test "$(find "$download_root" -mindepth 1 -maxdepth 1 -type f | wc -l)" = "2"
          test -z "$(find "$download_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          (cd "$download_root" && sha256sum --check --strict SHA256SUMS)
          gzip -t "$local_archive"

          install -d -m 700 "$artifact_root"
          while IFS= read -r archive_entry; do
            case "$archive_entry" in
              /*|../*|*/../*|*/..) echo "Unsafe release archive entry: $archive_entry" >&2; exit 1 ;;
            esac
          done < <(tar -tzf "$local_archive")
          tar --extract --gzip --file "$local_archive" --directory "$artifact_root" \
            --no-same-owner --no-same-permissions

          node --input-type=module - "$artifact_root/.release-artifact.json" "$DEPLOY_SHA" "$DEPLOY_TREE_SHA" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const [metadataPath, expectedSha, expectedTree] = process.argv.slice(2);
          const metadata = JSON.parse(await readFile(metadataPath, "utf8"));
          assert.equal(metadata.formatVersion, 1);
          assert.equal(metadata.kind, "riic-web-standalone");
          assert.equal(metadata.releaseSha, expectedSha);
          assert.equal(metadata.releaseTreeSha, expectedTree);
          NODE

          unsupported_local_entry="$(find "$artifact_root" -mindepth 1 ! -type f ! -type d -print -quit)"
          if [[ -n "$unsupported_local_entry" ]]; then
            echo "Standalone release tree contains unsupported filesystem entries: $unsupported_local_entry" >&2
            exit 1
          fi

          archive_bytes="$(stat -c '%s' "$local_archive")"
          archive_sha256="$(sha256sum "$local_archive" | cut -d ' ' -f 1)"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'DEPLOY_ARTIFACT_ROOT=%s\n' "$artifact_root"
            printf 'DEPLOY_LOCAL_ARCHIVE=%s\n' "$local_archive"
            printf 'DEPLOY_ARCHIVE_BYTES=%s\n' "$archive_bytes"
            printf 'DEPLOY_ARCHIVE_SHA256=%s\n' "$archive_sha256"
          } >> "$GITHUB_ENV"

          {
            echo "### Downloaded release artifact"
            echo
            echo "| Environment | Commit | Tree | Bytes | SHA-256 |"
            echo "| --- | --- | --- | ---: | --- |"
            echo "| $DEPLOYMENT_ENV | \`${DEPLOY_SHA:0:12}\` | \`${DEPLOY_TREE_SHA:0:12}\` | $archive_bytes | \`$archive_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify installed deployment helper contract
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          verify_helper() {
            local label="$1"
            local helper_path="$2"
            local expected_contract="$3"
            local metadata actual_contract artifact_sha256

            metadata="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "test -f '$helper_path' && test ! -L '$helper_path' && stat -c '%U:%G:%a' -- '$helper_path'")"
            if [[ "$metadata" != "root:root:755" ]]; then
              echo "$label helper must be a root:root 0755 regular file; received: $metadata" >&2
              exit 1
            fi

            actual_contract="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "'$helper_path' --contract-version")"
            if [[ "$actual_contract" != "$expected_contract" ]]; then
              echo "$label helper contract mismatch: expected $expected_contract, received $actual_contract" >&2
              exit 1
            fi

            artifact_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "sha256sum -- '$helper_path' | cut -d ' ' -f 1")"
            [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s helper contract=%s sha256=%s\n' "$label" "$actual_contract" "$artifact_sha256" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          verify_helper deploy /usr/local/sbin/arknights-infra-deploy \
            "$DEPLOY_RELEASE_HELPER_CONTRACT"

      - name: Sync standalone release tree and assemble verified archive
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          release_tree_cache=".cache/riic-web/${DEPLOYMENT_ENV}-standalone-tree"
          remote_archive="/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"
          ssh_target="${DEPLOY_SSH_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          test -f "$DEPLOY_LOCAL_ARCHIVE"
          test ! -L "$DEPLOY_LOCAL_ARCHIVE"
          test "$(stat -c '%s' "$DEPLOY_LOCAL_ARCHIVE")" = "$DEPLOY_ARCHIVE_BYTES"
          test "$(sha256sum "$DEPLOY_LOCAL_ARCHIVE" | cut -d ' ' -f 1)" = "$DEPLOY_ARCHIVE_SHA256"
          [[ "$DEPLOY_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]]
          test -d "$DEPLOY_ARTIFACT_ROOT"
          test ! -L "$DEPLOY_ARTIFACT_ROOT"
          unsupported_local_entry="$(find "$DEPLOY_ARTIFACT_ROOT" -mindepth 1 ! -type f ! -type d -print -quit)"
          if [[ -n "$unsupported_local_entry" ]]; then
            echo "Standalone release tree contains unsupported filesystem entries: $unsupported_local_entry" >&2
            exit 1
          fi
          command -v rsync >/dev/null || {
            echo "The release runner must provide rsync for verified file-tree delta transfer." >&2
            exit 1
          }

          timeout --kill-after=5s 30s ssh "${ssh_options[@]}" "$ssh_target" \
            "set -eu
             command -v rsync >/dev/null
             cache_parent=\"\$HOME/.cache/riic-web\"
             remote_cache_path=\"\$HOME/$release_tree_cache\"
             test ! -L \"\$cache_parent\"
             install -d -m 700 -- \"\$cache_parent\"
             test -d \"\$cache_parent\"
             test ! -L \"\$cache_parent\"
             test \"\$(stat -c '%U:%a' -- \"\$cache_parent\")\" = \"\$(id -un):700\"
             case \"\$remote_cache_path\" in \"\$cache_parent\"/*) ;; *) exit 1 ;; esac
             if [ -e \"\$remote_cache_path\" ]; then
               test -d \"\$remote_cache_path\"
               test ! -L \"\$remote_cache_path\"
             else
               install -d -m 700 -- \"\$remote_cache_path\"
             fi
             test \"\$(stat -c '%U:%a' -- \"\$remote_cache_path\")\" = \"\$(id -un):700\"
             test -z \"\$(find \"\$remote_cache_path\" -mindepth 1 ! -type f ! -type d -print -quit)\""

          timeout --kill-after=10s 5400s rsync \
            --recursive \
            --times \
            --perms \
            --checksum \
            --compress \
            --delete-delay \
            --partial \
            --inplace \
            --no-owner \
            --no-group \
            --info=progress2 \
            --stats \
            -e "ssh ${ssh_options[*]}" \
            -- "$DEPLOY_ARTIFACT_ROOT/" "$ssh_target:$release_tree_cache/"

          timeout --kill-after=10s 900s ssh "${ssh_options[@]}" "$ssh_target" \
            "set -eu
             remote_cache_path=\"\$HOME/$release_tree_cache\"
             test -d \"\$remote_cache_path\"
             test ! -L \"\$remote_cache_path\"
             chmod 700 -- \"\$remote_cache_path\"
             test \"\$(stat -c '%U:%a' -- \"\$remote_cache_path\")\" = \"\$(id -un):700\"
             test -z \"\$(find \"\$remote_cache_path\" -mindepth 1 ! -type f ! -type d -print -quit)\"
             staged_archive=\"\$(mktemp '${remote_archive}.XXXXXX')\"
             trap 'rm -f -- \"\$staged_archive\"' EXIT HUP INT TERM
             tar --sort=name \
               --mtime='@$SOURCE_DATE_EPOCH' \
               --owner=0 \
               --group=0 \
               --numeric-owner \
               --mode='u+rwX,go+rX,go-w' \
               --format=gnu \
               -cf - \
               -C \"\$remote_cache_path\" . \
               | gzip --best --no-name --rsyncable > \"\$staged_archive\"
             gzip -t \"\$staged_archive\"
             remote_bytes=\"\$(stat -c '%s' -- \"\$staged_archive\")\"
             remote_sha256=\"\$(sha256sum -- \"\$staged_archive\" | cut -d ' ' -f 1)\"
             test \"\$remote_bytes\" = '$DEPLOY_ARCHIVE_BYTES'
             test \"\$remote_sha256\" = '$DEPLOY_ARCHIVE_SHA256'
             chmod 600 -- \"\$staged_archive\"
             mv -fT -- \"\$staged_archive\" '$remote_archive'
             trap - EXIT HUP INT TERM"

          timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" \
            "test -f '$remote_archive' && test ! -L '$remote_archive'"
          remote_bytes="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" "stat -c '%s' -- '$remote_archive'")"
          remote_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" "sha256sum -- '$remote_archive' | cut -d ' ' -f 1")"
          test "$remote_bytes" = "$DEPLOY_ARCHIVE_BYTES"
          test "$remote_sha256" = "$DEPLOY_ARCHIVE_SHA256"
          printf 'archive transfer=rsync file-tree delta total_bytes=%s sha256=%s\n' \
            "$DEPLOY_ARCHIVE_BYTES" "$DEPLOY_ARCHIVE_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          public_health_argument=""
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_argument="@stdin"
          fi
          printf '%s\n' "$DEPLOY_PUBLIC_HEALTH_URL" | ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/arknights-infra-deploy \
            '$DEPLOYMENT_ENV' \
            '$DEPLOY_SHA' \
            '/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz' \
            '$DEPLOY_APP_ROOT' \
            '$DEPLOY_SERVICE' \
            '$DEPLOY_RUN_USER' \
            '$DEPLOY_INTERNAL_PORT' \
            '$public_health_argument' \
            '$DEPLOY_DEBUG_TOOLS_ENABLED' \
            '$DEPLOY_RATE_LIMIT_ENABLED' \
            '$DEPLOY_EXPECTED_REPOSITORY' \
            '$DEPLOY_APPROVED_SOLVER_SHA256' \
            '$DEPLOY_TREE_SHA'"

      - name: Remove staged release artifacts from the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOY_ARTIFACT_PARENT:-}" ]]; then
            case "$DEPLOY_ARTIFACT_PARENT" in
              "$RUNNER_TEMP"/riic-web-release-[0-9]*-[0-9]*) rm -rf -- "$DEPLOY_ARTIFACT_PARENT" ;;
              *) echo "Refusing to remove unexpected artifact path: $DEPLOY_ARTIFACT_PARENT" >&2; exit 1 ;;
            esac
          fi

      - name: Remove SSH credentials from the runner
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify public response compression
        if: env.DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED == '1'
        env:
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: node scripts/verify-public-compression.mjs
