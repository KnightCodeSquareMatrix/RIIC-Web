name: Deploy verified branch

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      vars.DEPLOY_AUTOMATION_ENABLED == '1' &&
      github.repository == 'KnightCodeSquareMatrix/RIIC-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ENV: production
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_DEBUG_TOOLS_ENABLED: ${{ vars.DEPLOY_DEBUG_TOOLS_ENABLED || '0' }}
      DEPLOY_RATE_LIMIT_ENABLED: ${{ vars.DEPLOY_RATE_LIMIT_ENABLED || '1' }}
      DEPLOY_APPROVED_SOLVER_SHA256: ${{ vars.DEPLOY_APPROVED_SOLVER_SHA256 }}
      DEPLOY_EXPECTED_REPOSITORY: KnightCodeSquareMatrix/RIIC-Web
      DEPLOY_RELEASE_HELPER_CONTRACT: "5"

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve verified release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          deploy_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$deploy_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'DEPLOY_TREE_SHA=%s\n' "$deploy_tree_sha"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
          } >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          [[ "$DEPLOY_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_SSH_USER" != "root"
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_SERVICE" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$DEPLOY_DEBUG_TOOLS_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_RATE_LIMIT_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_APPROVED_SOLVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$DEPLOY_EXPECTED_REPOSITORY" = "KnightCodeSquareMatrix/RIIC-Web"
          [[ "$DEPLOY_RELEASE_HELPER_CONTRACT" =~ ^[1-9][0-9]*$ ]]
          if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
            test "$DEPLOY_APP_ROOT" = "/opt/arknights-infra"
            test "$DEPLOY_SERVICE" = "arknights-infra"
          else
            [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra-[A-Za-z0-9._-]+$ ]]
            [[ "$DEPLOY_SERVICE" =~ ^arknights-infra-[A-Za-z0-9_.@-]+$ ]]
          fi
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_url_pattern='^https?://[A-Za-z0-9._:/?&=%-]+$'
            [[ "$DEPLOY_PUBLIC_HEALTH_URL" =~ $public_health_url_pattern ]]
            echo "DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Install verified build dependencies
        run: npm ci

      - name: Build standalone release
        env:
          APP_BUILD_ID: ${{ env.DEPLOY_SHA }}
          APP_DEPLOYMENT_ENV: ${{ env.DEPLOYMENT_ENV }}
          SKLAND_FEATURE_ENABLED: "1"
          ACCOUNT_CLOUD_SYNC_ENABLED: "1"
          DATABASE_URL: ""
          DATABASE_MIGRATION_URL: ""
          BETTER_AUTH_SECRET: ""
          BETTER_AUTH_URL: ""
          RESEND_API_KEY: ""
          AUTH_EMAIL_FROM: ""
        run: npm run build && npm run worker:build

      - name: Stage and archive standalone release
        shell: bash
        run: |
          set -euo pipefail
          artifact_parent="$(mktemp -d "$RUNNER_TEMP/riic-web-release.XXXXXX")"
          artifact_root="$artifact_parent/release"
          local_archive="$RUNNER_TEMP/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"
          {
            printf 'DEPLOY_ARTIFACT_PARENT=%s\n' "$artifact_parent"
            printf 'DEPLOY_LOCAL_ARCHIVE=%s\n' "$local_archive"
          } >> "$GITHUB_ENV"

          RELEASE_SHA="$DEPLOY_SHA" RELEASE_TREE_SHA="$DEPLOY_TREE_SHA" \
            npm run release:stage -- --output "$artifact_root"
          tar --sort=name \
            --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            -cf - \
            -C "$artifact_root" . \
            | gzip --best --no-name --rsyncable > "$local_archive"
          gzip -t "$local_archive"

          archive_bytes="$(stat -c '%s' "$local_archive")"
          archive_sha256="$(sha256sum "$local_archive" | cut -d ' ' -f 1)"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'DEPLOY_ARCHIVE_BYTES=%s\n' "$archive_bytes"
            printf 'DEPLOY_ARCHIVE_SHA256=%s\n' "$archive_sha256"
          } >> "$GITHUB_ENV"

          {
            echo "### Standalone release artifact"
            echo
            echo "| Environment | Commit | Tree | Bytes | SHA-256 |"
            echo "| --- | --- | --- | ---: | --- |"
            echo "| $DEPLOYMENT_ENV | \`${DEPLOY_SHA:0:12}\` | \`${DEPLOY_TREE_SHA:0:12}\` | $archive_bytes | \`$archive_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify installed deployment helper contract
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          verify_helper() {
            local label="$1"
            local helper_path="$2"
            local expected_contract="$3"
            local metadata actual_contract artifact_sha256

            metadata="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "test -f '$helper_path' && test ! -L '$helper_path' && stat -c '%U:%G:%a' -- '$helper_path'")"
            if [[ "$metadata" != "root:root:755" ]]; then
              echo "$label helper must be a root:root 0755 regular file; received: $metadata" >&2
              exit 1
            fi

            actual_contract="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "'$helper_path' --contract-version")"
            if [[ "$actual_contract" != "$expected_contract" ]]; then
              echo "$label helper contract mismatch: expected $expected_contract, received $actual_contract" >&2
              exit 1
            fi

            artifact_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "sha256sum -- '$helper_path' | cut -d ' ' -f 1")"
            [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s helper contract=%s sha256=%s\n' "$label" "$actual_contract" "$artifact_sha256" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          verify_helper deploy /usr/local/sbin/arknights-infra-deploy \
            "$DEPLOY_RELEASE_HELPER_CONTRACT"

      - name: Upload standalone release archive
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          archive_cache=".cache/riic-web/${DEPLOYMENT_ENV}-standalone.tar.gz"
          remote_archive="/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"
          ssh_target="${DEPLOY_SSH_USER}@${DEPLOY_HOST}"
          upload_chunk_bytes=$((4 * 1024 * 1024))
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          test -f "$DEPLOY_LOCAL_ARCHIVE"
          test ! -L "$DEPLOY_LOCAL_ARCHIVE"
          test "$(stat -c '%s' "$DEPLOY_LOCAL_ARCHIVE")" = "$DEPLOY_ARCHIVE_BYTES"
          test "$(sha256sum "$DEPLOY_LOCAL_ARCHIVE" | cut -d ' ' -f 1)" = "$DEPLOY_ARCHIVE_SHA256"
          [[ "$DEPLOY_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]]

          timeout --kill-after=5s 30s ssh "${ssh_options[@]}" "$ssh_target" \
            "set -eu
             cache_dir=\"\$HOME/.cache/riic-web\"
             test ! -L \"\$cache_dir\"
             install -d -m 700 -- \"\$cache_dir\"
             test -d \"\$cache_dir\"
             test ! -L \"\$cache_dir\"
             test \"\$(stat -c '%U:%a' -- \"\$cache_dir\")\" = \"\$(id -un):700\"
             cache_file=\"\$HOME/$archive_cache\"
             test ! -L \"\$cache_file\"
             if [ -e \"\$cache_file\" ]; then
               test -f \"\$cache_file\"
             else
               umask 077
               : > \"\$cache_file\"
             fi
             chmod 600 -- \"\$cache_file\""

          reset_remote_cache() {
            timeout --kill-after=5s 30s ssh "${ssh_options[@]}" "$ssh_target" \
              "set -eu
               cache_file=\"\$HOME/$archive_cache\"
               test -f \"\$cache_file\"
               test ! -L \"\$cache_file\"
               : > \"\$cache_file\"
               chmod 600 -- \"\$cache_file\""
          }

          remote_cache_bytes() {
            timeout --kill-after=5s 30s ssh "${ssh_options[@]}" "$ssh_target" \
              "cache_file=\"\$HOME/$archive_cache\"; test -f \"\$cache_file\"; test ! -L \"\$cache_file\"; stat -c '%s' -- \"\$cache_file\""
          }

          resumed_bytes=0
          transfer_method="verified chunks"
          if command -v rsync >/dev/null \
            && timeout --kill-after=5s 30s ssh "${ssh_options[@]}" "$ssh_target" \
              "command -v rsync >/dev/null"; then
            transfer_method="rsync delta"
            resumed_bytes="$(remote_cache_bytes)"
            [[ "$resumed_bytes" =~ ^[0-9]+$ ]]
            timeout --kill-after=10s 5400s rsync \
              --checksum \
              --partial \
              --inplace \
              --no-owner \
              --no-group \
              --chmod=F600 \
              --info=progress2 \
              -e "ssh ${ssh_options[*]}" \
              -- "$DEPLOY_LOCAL_ARCHIVE" "$ssh_target:$archive_cache"
          else
            remote_bytes="$(remote_cache_bytes)"
            [[ "$remote_bytes" =~ ^[0-9]+$ ]]
            remote_prefix_sha256=""

            if (( remote_bytes > DEPLOY_ARCHIVE_BYTES )); then
              reset_remote_cache
              remote_bytes=0
            elif (( remote_bytes > 0 )); then
              local_prefix_sha256="$(head -c "$remote_bytes" "$DEPLOY_LOCAL_ARCHIVE" | sha256sum | cut -d ' ' -f 1)"
              remote_prefix_sha256="$(timeout --kill-after=5s 60s ssh "${ssh_options[@]}" "$ssh_target" \
                "cache_file=\"\$HOME/$archive_cache\"; head -c '$remote_bytes' \"\$cache_file\" | sha256sum | cut -d ' ' -f 1")"
              if [[ "$local_prefix_sha256" != "$remote_prefix_sha256" ]]; then
                reset_remote_cache
                remote_bytes=0
              fi
            fi

            resumed_bytes="$remote_bytes"
            while (( remote_bytes < DEPLOY_ARCHIVE_BYTES )); do
              remaining_bytes=$((DEPLOY_ARCHIVE_BYTES - remote_bytes))
              if (( remaining_bytes < upload_chunk_bytes )); then
                current_chunk_bytes="$remaining_bytes"
              else
                current_chunk_bytes="$upload_chunk_bytes"
              fi
              expected_remote_bytes=$((remote_bytes + current_chunk_bytes))

              dd if="$DEPLOY_LOCAL_ARCHIVE" \
                bs=1M \
                skip="$remote_bytes" \
                count="$current_chunk_bytes" \
                iflag=skip_bytes,count_bytes \
                status=none \
                | timeout --kill-after=10s 900s ssh "${ssh_options[@]}" "$ssh_target" \
                  "set -eu
                   cache_file=\"\$HOME/$archive_cache\"
                   test -f \"\$cache_file\"
                   test ! -L \"\$cache_file\"
                   test \"\$(stat -c '%s' -- \"\$cache_file\")\" = '$remote_bytes'
                   cat >> \"\$cache_file\""

              remote_bytes="$(remote_cache_bytes)"
              test "$remote_bytes" = "$expected_remote_bytes"
              printf 'Uploaded %s/%s bytes\n' "$remote_bytes" "$DEPLOY_ARCHIVE_BYTES"
            done
          fi

          remote_bytes="$(remote_cache_bytes)"
          remote_sha256="$(timeout --kill-after=5s 60s ssh "${ssh_options[@]}" "$ssh_target" \
            "cache_file=\"\$HOME/$archive_cache\"; sha256sum -- \"\$cache_file\" | cut -d ' ' -f 1")"
          test "$remote_bytes" = "$DEPLOY_ARCHIVE_BYTES"
          test "$remote_sha256" = "$DEPLOY_ARCHIVE_SHA256"

          timeout --kill-after=5s 60s ssh "${ssh_options[@]}" "$ssh_target" \
            "set -eu
             cache_file=\"\$HOME/$archive_cache\"
             test -f \"\$cache_file\"
             test ! -L \"\$cache_file\"
             test \"\$(stat -c '%s' -- \"\$cache_file\")\" = '$DEPLOY_ARCHIVE_BYTES'
             test \"\$(sha256sum -- \"\$cache_file\" | cut -d ' ' -f 1)\" = '$DEPLOY_ARCHIVE_SHA256'
             staged_archive=\"\$(mktemp '${remote_archive}.XXXXXX')\"
             trap 'rm -f -- \"\$staged_archive\"' EXIT
             install -m 600 -- \"\$cache_file\" \"\$staged_archive\"
             mv -fT -- \"\$staged_archive\" '$remote_archive'
             trap - EXIT"

          timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" \
            "test -f '$remote_archive' && test ! -L '$remote_archive'"
          remote_bytes="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" "stat -c '%s' -- '$remote_archive'")"
          remote_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "$ssh_target" "sha256sum -- '$remote_archive' | cut -d ' ' -f 1")"
          test "$remote_bytes" = "$DEPLOY_ARCHIVE_BYTES"
          test "$remote_sha256" = "$DEPLOY_ARCHIVE_SHA256"
          printf 'archive transfer=%s cached_bytes=%s total_bytes=%s\n' \
            "$transfer_method" "$resumed_bytes" "$DEPLOY_ARCHIVE_BYTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          public_health_argument=""
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_argument="@stdin"
          fi
          printf '%s\n' "$DEPLOY_PUBLIC_HEALTH_URL" | ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/arknights-infra-deploy \
            '$DEPLOYMENT_ENV' \
            '$DEPLOY_SHA' \
            '/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz' \
            '$DEPLOY_APP_ROOT' \
            '$DEPLOY_SERVICE' \
            '$DEPLOY_RUN_USER' \
            '$DEPLOY_INTERNAL_PORT' \
            '$public_health_argument' \
            '$DEPLOY_DEBUG_TOOLS_ENABLED' \
            '$DEPLOY_RATE_LIMIT_ENABLED' \
            '$DEPLOY_EXPECTED_REPOSITORY' \
            '$DEPLOY_APPROVED_SOLVER_SHA256' \
            '$DEPLOY_TREE_SHA'"

      - name: Remove staged release artifacts from the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOY_ARTIFACT_PARENT:-}" ]]; then
            case "$DEPLOY_ARTIFACT_PARENT" in
              "$RUNNER_TEMP"/riic-web-release.*) rm -rf -- "$DEPLOY_ARTIFACT_PARENT" ;;
              *) echo "Refusing to remove unexpected artifact path: $DEPLOY_ARTIFACT_PARENT" >&2; exit 1 ;;
            esac
          fi
          if [[ -n "${DEPLOY_LOCAL_ARCHIVE:-}" ]]; then
            case "$DEPLOY_LOCAL_ARCHIVE" in
              "$RUNNER_TEMP"/arknights-infra-*.tar.gz) rm -f -- "$DEPLOY_LOCAL_ARCHIVE" ;;
              *) echo "Refusing to remove unexpected archive path: $DEPLOY_LOCAL_ARCHIVE" >&2; exit 1 ;;
            esac
          fi

      - name: Remove SSH credentials from the runner
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify public response compression
        if: env.DEPLOY_PUBLIC_HEALTH_CHECK_ENABLED == '1'
        env:
          DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
        run: node scripts/verify-public-compression.mjs
