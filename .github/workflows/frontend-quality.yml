name: Post-merge release

on:
  workflow_dispatch:
    inputs:
      run_webkit:
        description: Run the full WebKit compatibility suite
        required: false
        default: true
        type: boolean
      deploy:
        description: Deploy the verified main or develop ref after all required checks pass
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact ref commit required when deploy is requested by workflow dispatch
        required: false
        default: ""
        type: string
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: post-merge-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BETA_DEBUG_TOOLS_ENABLED: "0"
  BETA_RATE_LIMIT_ENABLED: "0"
  BETA_TRUST_PROXY_HEADERS: "0"
  DATABASE_URL: postgresql://arknights_test_runtime:runtime-test-only@127.0.0.1:5432/arknights_auth_test
  DATABASE_MIGRATION_URL: postgresql://arknights_test_migration:migration-test-only@127.0.0.1:5432/arknights_auth_test
  AUTH_INTEGRATION_DATABASE_URL: postgresql://arknights_test_runtime:runtime-test-only@127.0.0.1:5432/arknights_auth_test
  BETTER_AUTH_SECRET: integration-test-secret-at-least-32-bytes-long
  BETTER_AUTH_URL: https://auth.integration.test
  RESEND_API_KEY: re_test_not_used
  AUTH_EMAIL_FROM: Authentication Test <auth@example.test>

jobs:
  changes:
    name: Change scope
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      reason: ${{ steps.scope.outputs.reason }}
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
      run_core: ${{ steps.scope.outputs.run_core }}
      run_browser: ${{ steps.scope.outputs.run_browser }}
      deploy_required: ${{ steps.scope.outputs.deploy_required }}
      deployment_authorized: ${{ steps.deploy_authorization.outputs.authorized }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize deployment trigger
        id: deploy_authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          authorized=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            authorized=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DEPLOY_REQUESTED" == "true" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
            [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]
            authorized=true
          fi
          printf 'authorized=%s\n' "$authorized" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.zlist"
          : > "$changed_files"
          classifier=(
            node scripts/ci-change-scope.mjs
            --input "$changed_files"
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )

          if [[ "$EVENT_NAME" == "push" ]] \
            && [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" \
            && git cat-file -e "${HEAD_SHA}^{commit}"; then
            git diff --name-only -z "$PUSH_BEFORE_SHA..$HEAD_SHA" > "$changed_files"
            "${classifier[@]}"
          else
            "${classifier[@]}" --force-full
          fi

  repository_hygiene:
    name: Repository hygiene
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject private paths and sensitive content
        run: npm run check:public-repository

  static_checks:
    name: Static and unit checks
    needs: changes
    if: needs.changes.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:security

      - name: Generated asset consistency
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API contract tests
        run: npm run test:api-contract

      - name: Shift comparison tests
        run: npm run test:shift-comparison

  database_checks:
    name: Database integration
    needs: changes
    if: needs.changes.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: arknights_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arknights_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public database deployment files
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/postgres/example.env deploy/postgres/production.env
          cp deploy/postgres/example.env deploy/postgres/development.env
          docker compose -f deploy/postgres/compose.yml config >/dev/null
          bash -n deploy/postgres/init-roles.sh deploy/postgres/backup.sh
          rm -f deploy/postgres/production.env deploy/postgres/development.env

      - name: Initialize limited database roles
        run: |
          docker run --rm --network host \
            -v "$PWD/deploy/postgres/init-roles.sh:/init-roles.sh:ro" \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGPASSWORD=postgres-test-only \
            -e POSTGRES_DB=arknights_auth_test \
            -e POSTGRES_USER=postgres \
            -e AUTH_RUNTIME_USER=arknights_test_runtime \
            -e AUTH_RUNTIME_PASSWORD=runtime-test-only \
            -e AUTH_MIGRATION_USER=arknights_test_migration \
            -e AUTH_MIGRATION_PASSWORD=migration-test-only \
            -e AUTH_BACKUP_USER=arknights_test_backup \
            -e AUTH_BACKUP_PASSWORD=backup-test-only \
            postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636 \
            sh /init-roles.sh

      - name: Verify committed database migrations
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Apply committed authentication migrations
        run: npm run db:migrate

      - name: Authentication runtime readiness
        run: npm run auth:check

      - name: Verify limited database grants and backup access
        shell: bash
        run: |
          set -euo pipefail
          backup_url='postgresql://arknights_test_backup@127.0.0.1:5432/arknights_auth_test'
          runtime_url='postgresql://arknights_test_runtime@127.0.0.1:5432/arknights_auth_test'
          image='postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636'
          docker run --rm --network host -e PGPASSWORD=backup-test-only "$image" \
            psql "$backup_url" -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM drizzle.__drizzle_migrations;'
          if docker run --rm --network host -e PGPASSWORD=backup-test-only "$image" \
            psql "$backup_url" -v ON_ERROR_STOP=1 -c 'DELETE FROM "user" WHERE false;'; then
            echo 'backup role unexpectedly has write access' >&2
            exit 1
          fi
          if docker run --rm --network host -e PGPASSWORD=runtime-test-only "$image" \
            psql "$runtime_url" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.runtime_must_not_create (id integer);'; then
            echo 'runtime role unexpectedly has DDL access' >&2
            exit 1
          fi
          docker run --rm --network host \
            -e PGPASSWORD=backup-test-only \
            "$image" \
            pg_dump --format=custom --no-owner --no-acl "$backup_url" >/dev/null

      - name: PostgreSQL authentication integration
        run: npm run test:auth-integration

  release_artifact:
    name: Build release once
    needs: changes
    if: needs.changes.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone application and worker
        env:
          APP_BUILD_ID: ${{ github.sha }}
          APP_DEPLOYMENT_ENV: ${{ env.DEPLOYMENT_ENV }}
          SKLAND_FEATURE_ENABLED: "1"
          ACCOUNT_CLOUD_SYNC_ENABLED: "1"
          DATABASE_URL: ""
          DATABASE_MIGRATION_URL: ""
          BETTER_AUTH_SECRET: ""
          BETTER_AUTH_URL: ""
          RESEND_API_KEY: ""
          AUTH_EMAIL_FROM: ""
        run: npm run build && npm run worker:build && node --check dist/plan-worker.cjs

      - name: Release output checks
        env:
          APP_DEPLOYMENT_ENV: production
          SKLAND_FEATURE_ENABLED: "1"
        run: |
          npm run check:bundle-budget
          npm run check:build-traces
          npm run check:production-client

      - name: Stage verified release artifact
        shell: bash
        run: |
          set -euo pipefail
          release_parent="$(mktemp -d "$RUNNER_TEMP/riic-web-release.XXXXXX")"
          release_root="$release_parent/release"
          upload_root="$RUNNER_TEMP/riic-web-release-upload"
          archive="$upload_root/arknights-infra-${DEPLOYMENT_ENV}-${GITHUB_SHA}.tar.gz"
          release_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$release_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          install -d -m 700 "$upload_root"

          RELEASE_SHA="$GITHUB_SHA" RELEASE_TREE_SHA="$release_tree_sha" \
            npm run release:stage -- --output "$release_root"
          tar --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            --format=gnu \
            -cf - \
            -C "$release_root" . \
            | gzip --best --no-name --rsyncable > "$archive"
          gzip -t "$archive"

          archive_bytes="$(stat -c '%s' "$archive")"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" > "$upload_root/SHA256SUMS"
          {
            echo "### Verified release artifact"
            echo
            echo "| Environment | Commit | Tree | Bytes | SHA-256 |"
            echo "| --- | --- | --- | ---: | --- |"
            echo "| $DEPLOYMENT_ENV | \`${GITHUB_SHA:0:12}\` | \`${release_tree_sha:0:12}\` | $archive_bytes | \`$archive_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release for deployment
        if: >-
          needs.changes.outputs.deploy_required == 'true' &&
          needs.changes.outputs.deployment_authorized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riic-web-release-${{ github.sha }}
          path: ${{ runner.temp }}/riic-web-release-upload/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser_e2e:
    name: Chromium E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --user 1001
    env:
      DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      DATABASE_MIGRATION_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      AUTH_INTEGRATION_DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: arknights_auth_test
          POSTGRES_USER: arknights_e2e
          POSTGRES_PASSWORD: e2e-test-only
        options: >-
          --health-cmd "pg_isready -U arknights_e2e -d arknights_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply committed authentication migrations
        run: npm run db:migrate

      - name: Chromium end-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

  browser_boundaries:
    name: Browser release boundaries
    needs: changes
    if: needs.changes.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --user 1001
    env:
      DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      DATABASE_MIGRATION_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      AUTH_INTEGRATION_DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: arknights_auth_test
          POSTGRES_USER: arknights_e2e
          POSTGRES_PASSWORD: e2e-test-only
        options: >-
          --health-cmd "pg_isready -U arknights_e2e -d arknights_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply committed authentication migrations
        run: npm run db:migrate

      - name: WebKit Skland QR smoke test
        run: npm run test:e2e:webkit:skland-qr

      - name: Production profile enabled boundary
        run: npm run test:e2e:production-profile

  webkit_e2e:
    name: Scheduled WebKit compatibility
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_webkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --user 1001
    env:
      DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      DATABASE_MIGRATION_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
      AUTH_INTEGRATION_DATABASE_URL: postgresql://arknights_e2e:e2e-test-only@postgres:5432/arknights_auth_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: arknights_auth_test
          POSTGRES_USER: arknights_e2e
          POSTGRES_PASSWORD: e2e-test-only
        options: >-
          --health-cmd "pg_isready -U arknights_e2e -d arknights_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply committed authentication migrations
        run: npm run db:migrate

      - name: WebKit end-to-end tests
        run: npm run test:e2e:webkit

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, repository_hygiene, static_checks, database_checks, release_artifact, browser_e2e, browser_boundaries]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Verify all post-merge checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HYGIENE_RESULT: ${{ needs.repository_hygiene.result }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          DATABASE_RESULT: ${{ needs.database_checks.result }}
          BUILD_RESULT: ${{ needs.release_artifact.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser_e2e.result }}
          BROWSER_BOUNDARIES_RESULT: ${{ needs.browser_boundaries.result }}
          RUN_CORE: ${{ needs.changes.outputs.run_core }}
          RUN_BROWSER: ${{ needs.changes.outputs.run_browser }}
          DEPLOY_REQUIRED: ${{ needs.changes.outputs.deploy_required }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$HYGIENE_RESULT" = "success"
          [[ "$DEPLOY_REQUIRED" == "true" || "$DEPLOY_REQUIRED" == "false" ]]

          verify_result() {
            local required="$1"
            local actual="$2"
            local label="$3"
            [[ "$required" == "true" || "$required" == "false" ]]
            if [[ "$required" == "true" ]]; then
              test "$actual" = "success"
            else
              test "$actual" = "skipped"
            fi
            printf '%s required=%s result=%s\n' "$label" "$required" "$actual"
          }

          verify_result "$RUN_CORE" "$STATIC_RESULT" static
          verify_result "$RUN_CORE" "$DATABASE_RESULT" database
          verify_result "$RUN_CORE" "$BUILD_RESULT" build
          verify_result "$RUN_BROWSER" "$BROWSER_E2E_RESULT" chromium
          verify_result "$RUN_BROWSER" "$BROWSER_BOUNDARIES_RESULT" browser-boundaries

  deploy:
    needs: [changes, quality, release_artifact]
    if: >-
      (github.ref_name == 'main' || github.ref_name == 'develop') &&
      needs.changes.outputs.deployment_authorized == 'true' &&
      needs.quality.result == 'success' &&
      needs.release_artifact.result == 'success' &&
      needs.changes.outputs.deploy_required == 'true' &&
      vars.DEPLOY_AUTOMATION_ENABLED == '1' &&
      github.repository == 'KnightCodeSquareMatrix/RIIC-Web'
    uses: ./.github/workflows/deploy.yml
    with:
      artifact_name: riic-web-release-${{ github.sha }}
    secrets: inherit
