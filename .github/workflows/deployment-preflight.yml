name: Deployment preflight

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect without creating a release
        required: true
        type: choice
        options:
          - development
          - production
      mode:
        description: Inspect the legacy baseline or enforce every public-cutover prerequisite
        required: true
        default: cutover-ready
        type: choice
        options:
          - baseline
          - cutover-ready

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'KnightCodeSquareMatrix/RIIC-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deployment-preflight-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PREFLIGHT_MODE: ${{ inputs.mode }}
      DEPLOY_APPROVED_SOLVER_SHA256: ${{ vars.DEPLOY_APPROVED_SOLVER_SHA256 }}
      DEPLOY_EXPECTED_REPOSITORY: KnightCodeSquareMatrix/RIIC-Web
      DEPLOY_PREPARE_HELPER_CONTRACT: "2"
      DEPLOY_RELEASE_HELPER_CONTRACT: "4"

    steps:
      - name: Validate preflight configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_SSH_USER" != "root"
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$PREFLIGHT_MODE" == "baseline" || "$PREFLIGHT_MODE" == "cutover-ready" ]]
          test "$DEPLOY_EXPECTED_REPOSITORY" = "KnightCodeSquareMatrix/RIIC-Web"
          if [[ "$PREFLIGHT_MODE" == "cutover-ready" ]]; then
            [[ "$DEPLOY_APPROVED_SOLVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect helpers, cache, solver, and disk
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          verify_helper() {
            local label="$1"
            local helper_path="$2"
            local expected_contract="$3"
            local metadata actual_contract artifact_sha256

            metadata="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "test -f '$helper_path' && test ! -L '$helper_path' && stat -c '%U:%G:%a' -- '$helper_path'")"
            test "$metadata" = "root:root:755"
            actual_contract="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "'$helper_path' --contract-version")"
            [[ "$actual_contract" =~ ^[1-9][0-9]*$ ]]
            if [[ "$PREFLIGHT_MODE" == "cutover-ready" ]]; then
              test "$actual_contract" = "$expected_contract"
            fi
            artifact_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "sha256sum -- '$helper_path' | cut -d ' ' -f 1")"
            [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s helper contract=%s sha256=%s\n' "$label" "$actual_contract" "$artifact_sha256" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          verify_helper prepare /usr/local/sbin/arknights-infra-prepare-release \
            "$DEPLOY_PREPARE_HELPER_CONTRACT"
          verify_helper deploy /usr/local/sbin/arknights-infra-deploy \
            "$DEPLOY_RELEASE_HELPER_CONTRACT"

          timeout --kill-after=10s 60s ssh "${ssh_options[@]}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_APP_ROOT" "$PREFLIGHT_MODE" "$DEPLOY_ENVIRONMENT" \
              "$DEPLOY_EXPECTED_REPOSITORY" "$DEPLOY_APPROVED_SOLVER_SHA256" <<'REMOTE'
          set -euo pipefail
          app_root="$1"
          preflight_mode="$2"
          deployment_environment="$3"
          expected_repository="$4"
          approved_solver_sha256="$5"
          cache_repository="/var/cache/arknights-infra-deploy/repository.git"
          expected_origin="https://github.com/KnightCodeSquareMatrix/RIIC-Web.git"
          cutover_ready=0
          if [[ "$preflight_mode" == "cutover-ready" ]]; then
            cutover_ready=1
          elif [[ "$preflight_mode" != "baseline" ]]; then
            exit 1
          fi

          test -d "$app_root"
          test ! -L "$app_root"
          test -d "$cache_repository"
          test ! -L "$cache_repository"
          test "$(git --git-dir="$cache_repository" rev-parse --is-bare-repository)" = "true"
          configured_origin="$(git --git-dir="$cache_repository" remote get-url origin)"
          public_cache_ready=0
          if [[ "$configured_origin" == "$expected_origin" ]]; then
            public_cache_ready=1
          fi
          if [[ "$cutover_ready" == "1" ]]; then
            test "$public_cache_ready" = "1"
          fi

          if [[ "$cutover_ready" == "1" ]]; then
            sudo -n /usr/local/sbin/arknights-infra-deploy \
              --preflight "$deployment_environment" "$app_root" \
              "$expected_repository" "$approved_solver_sha256"
          else
            available_kib="$(df -Pk "$app_root" | awk 'NR == 2 { print $4 }')"
            [[ "$available_kib" =~ ^[0-9]+$ ]]
            (( available_kib >= 2097152 ))
            printf 'solver_source=not-inspected-root-only\n'
            printf 'available_kib=%s\n' "$available_kib"
          fi
          printf 'preflight_mode=%s cache_public_origin_ready=%s\n' \
            "$preflight_mode" "$public_cache_ready"
          REMOTE

          {
            echo
            echo "Preflight is read-only: no archive, release directory, symlink switch, or service restart was requested."
          } >> "$GITHUB_STEP_SUMMARY"
